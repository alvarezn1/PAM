<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle de ingresos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let ingreso of ingresos" lines="full">
      <ion-card>
        <ion-card-header>
          <ion-card-title>{{ ingreso.categoria }}</ion-card-title>
          <ion-card-subtitle>{{ ingreso.fecha }}</ion-card-subtitle>
        </ion-card-header>

        <ion-card-content>
          <div class="gasto-details">
            <ion-icon name="cash" class="gasto-icon" slot="start"></ion-icon>
            <p class="gasto-amount">Cantidad: <strong>${{ ingreso.cantidad }}</strong></p>
          </div>
          <p>Comentario: {{ ingreso.comentario }}</p>
        </ion-card-content>
      </ion-card>
    </ion-item>
  </ion-list>

  <div *ngIf="ingresos.length === 0" class="no-gastos">
    <ion-icon name="alert-circle" size="large"></ion-icon>
    <p>No hay ingresos registrados.</p>
  </div>
</ion-content>
